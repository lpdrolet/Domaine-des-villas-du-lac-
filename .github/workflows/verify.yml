name: Validation du portail premium
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Dépendances
        run: npm install --no-audit --no-fund
      - name: Syntaxe JavaScript
        run: npm run test
      - name: Génération du portail et des 16 fiches
        run: npm run build
      - name: Validation cadastrale, SEO et sécurité
        run: node scripts/qa-premium.mjs
