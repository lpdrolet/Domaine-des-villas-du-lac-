name: Vérification du portail immobilier
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installation des dépendances
        run: npm install --no-audit --no-fund
      - name: Vérification des pages, cartes et API
        run: npm test
      - name: Production du site et des 16 fiches
        run: npm run build
      - name: Vérifier les bundles générés
        run: |
          test -f dist/assets/admin.bundle.js
          test -f dist/assets/client.bundle.js
          test -f dist/sitemap.xml
          test -f dist/terrains/1800388.html
