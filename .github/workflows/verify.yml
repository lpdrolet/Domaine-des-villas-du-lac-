name: Validation du portail immobilier premium
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installation dépendances
        run: npm install --no-audit --no-fund
      - name: Syntaxe JavaScript
        run: npm test
      - name: Production du site
        run: npm run build
      - name: Tests pages, cadastre, sécurité et fiches
        run: node scripts/qa-premium.mjs
