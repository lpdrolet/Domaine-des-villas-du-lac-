name: Validation et build du portail immobilier
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Tests du site et contrôles de sécurité
        run: npm test
      - name: Préparer la version de production
        run: npm run build
      - name: Vérifier les fichiers publiés
        run: |
          test -f dist/index.html
          test -f dist/assets/admin.bundle.js
          test -f dist/assets/client.bundle.js
          test -f dist/terrains/1800388.html
          test -f dist/sitemap.xml
          test "$(find dist/terrains -type f -name '*.html' | wc -l)" -eq 16
